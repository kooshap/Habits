name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: "Also run XCUITest smoke tests"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: iOS Tests
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select available iPhone Simulator
        run: |
          SIM_INFO="$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys

          data = json.load(sys.stdin).get("devices", {})
          candidates = []
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              nums = [int(x) for x in re.findall(r"\d+", runtime.split("iOS")[-1])]
              iphones = [d for d in devices if d.get("isAvailable") and d.get("name", "").startswith("iPhone")]
              if iphones:
                  # Prefer standard non-Max/Plus iPhone models first for faster boot
                  iphones.sort(key=lambda d: ("Max" in d["name"] or "Plus" in d["name"], d["name"]))
                  candidates.append((nums, runtime, iphones[0]))

          if not candidates:
              sys.exit("No available iPhone simulator found")

          candidates.sort(key=lambda item: item[0], reverse=True)
          _, runtime, chosen = candidates[0]
          print(chosen["udid"], chosen["name"], runtime, sep="|")
          ')"

          IFS='|' read -r SIMULATOR_ID SIMULATOR_NAME SIMULATOR_RUNTIME <<< "$SIM_INFO"
          echo "Selected simulator: $SIMULATOR_NAME ($SIMULATOR_ID) on $SIMULATOR_RUNTIME"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Boot Simulator
        run: xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Run unit tests
        if: ${{ !inputs.run_ui_tests }}
        run: |
          xcodebuild test \
            -project Habits.xcodeproj \
            -scheme Habits \
            -destination "id=$SIMULATOR_ID" \
            -only-testing:HabitsTests \
            -parallel-testing-enabled NO

      - name: Run unit and UI tests
        if: ${{ inputs.run_ui_tests }}
        run: |
          xcodebuild test \
            -project Habits.xcodeproj \
            -scheme Habits \
            -destination "id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO
